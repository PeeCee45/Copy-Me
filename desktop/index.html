<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Copy Me</title>
<style>
body{font:15px system-ui,sans-serif;margin:0;padding:24px;background:#f6f5f1;color:#1c1b19}
@media (prefers-color-scheme:dark){body{background:#161512;color:#f1efe9}}
h1{margin:0 0 16px}h1 span{color:#e4572e}
.box{border:1px solid #8884;border-radius:12px;padding:14px;margin-bottom:14px}
.pin{font-size:34px;font-weight:700;letter-spacing:.2em}
input{width:100%;padding:10px;margin:4px 0 8px;border:1px solid #8886;border-radius:8px;box-sizing:border-box;font:inherit}
button{background:#e4572e;color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
#log{font:13px ui-monospace,monospace;white-space:pre-wrap;max-height:160px;overflow:auto}
</style></head><body>
<h1>Copy<span>Me</span></h1>
<div class="box"><b>Option A: be the host</b><br>Other devices enter this address and PIN:
<div id="addr">…</div><div class="pin" id="pin"></div></div>
<div class="box"><b>Option B: join another computer</b>
<input id="host" placeholder="192.168.1.20:8787">
<input id="jpin" placeholder="PIN">
<button id="go">Join</button></div>
<div class="box"><b>Connected devices</b><ul id="devs"><li>None yet</li></ul></div>
<div class="box" id="log"></div>
<script>
const { ipcRenderer } = require('electron');
ipcRenderer.on('info', (_, i) => {
  document.getElementById('addr').textContent = i.ips.map(ip => ip + ':' + i.port).join('  ·  ');
  document.getElementById('pin').textContent = i.pin;
  document.title = 'Copy Me · ' + i.name;
});
ipcRenderer.on('devices', (_, names) => {
  const ul = document.getElementById('devs'); ul.innerHTML = '';
  (names.length ? names : ['None yet']).forEach(n => {
    const li = document.createElement('li'); li.textContent = n; ul.appendChild(li);
  });
});
ipcRenderer.on('log', (_, m) => {
  const l = document.getElementById('log'); l.textContent = m + '\n' + l.textContent;
});
document.getElementById('go').onclick = () =>
  ipcRenderer.send('connect', { host: document.getElementById('host').value, pin: document.getElementById('jpin').value });
</script></body></html>
